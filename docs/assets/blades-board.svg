    <rect x="240" y="152" width="180" height="72" rx="7" fill="#14202A" stroke="#2A4053"/><text x="260" y="180" fill="#B7F36B" font-size="11" font-family="Consolas,monospace">02 / ROUTE</text><text x="260" y="207" fill="#EDF6FB" font-size="17">路由选择</text>
    <rect x="432" y="152" width="180" height="72" rx="7" fill="#14202A" stroke="#2A4053"/><text x="452" y="180" fill="#FFC857" font-size="11" font-family="Consolas,monospace">03 / CONTEXT</text><text x="452" y="207" fill="#EDF6FB" font-size="17">上下文保留</text>
    <rect x="624" y="152" width="180" height="72" rx="7" fill="#14202A" stroke="#2A4053"/><text x="644" y="180" fill="#65C7FF" font-size="11" font-family="Consolas,monospace">04 / ARTIFACT</text><text x="644" y="207" fill="#EDF6FB" font-size="17">真实产物</text>
    <rect x="816" y="152" width="180" height="72" rx="7" fill="#14202A" stroke="#2A4053"/><text x="836" y="180" fill="#FF7B62" font-size="11" font-family="Consolas,monospace">05 / VERIFY</text><text x="836" y="207" fill="#EDF6FB" font-size="17">结果验证</text>
