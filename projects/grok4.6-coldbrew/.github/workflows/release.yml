name: Grok 4.6 ColdBrew release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify source tree
        shell: bash
        run: |
          python -m unittest discover -s app -p 'test_*.py' -v
          python scripts/site_audit.py
          python scripts/release.py build
          python scripts/release.py verify
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grok-coldbrew-source
          path: |
            Grok-4.6-ColdBrew-${{ github.ref_name }}-Source.zip
            Grok-4.6-ColdBrew-${{ github.ref_name }}-Source.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_windows.py build
      - run: python scripts/build_windows.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grok-coldbrew-windows
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [source, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Grok 4.6 ColdBrew ${GITHUB_REF_NAME}" \
              --notes-file "RELEASE_NOTES_v${VERSION}.md"
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/grok-coldbrew-source/*.zip \
            release-assets/grok-coldbrew-source/*.sha256 \
            release-assets/grok-coldbrew-windows/*.exe \
            release-assets/grok-coldbrew-windows/*.sha256 \
            --clobber
