<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">ENI ColdBrew v5.0.1 MAX full-chain architecture</title>
  <desc id="desc">Exact activation flows through context isolation, one public route, a capability graph, MAX dual-engine overlays, and verified delivery.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#17b9cc"/><stop offset=".5" stop-color="#5c7cff"/><stop offset="1" stop-color="#a959e8"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7fbfd"/><stop offset="1" stop-color="#f3ebff"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7181a9"/></marker>
  </defs>
  <rect width="1440" height="480" rx="32" fill="#f7f9ff"/>
  <text x="720" y="52" text-anchor="middle" font-family="Inter,'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#405073">v5.0.1 · SINGLE ROUTE · FULL CHAIN · MAX DUAL ENGINE</text>
  <g font-family="Inter,'Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g transform="translate(35 112)"><rect width="235" height="250" rx="28" fill="#fff" stroke="#36bdd1" stroke-width="3"/><circle cx="117" cy="55" r="28" fill="#e4fafd"/><text x="117" y="65" font-size="28" font-weight="900" fill="#118ca3">1</text><text x="117" y="116" font-size="27" font-weight="850" fill="#17213b">冷咖啡</text><text x="117" y="155" font-size="18" fill="#697897">精确短激活词</text><text x="117" y="190" font-size="17" fill="#697897">MAX 状态锁存</text><text x="117" y="220" font-size="17" fill="#697897">CHAIN=FULL</text></g>
    <path d="M282 237h40" stroke="#7181a9" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(335 112)"><rect width="235" height="250" rx="28" fill="#fff" stroke="#58a8e9" stroke-width="3"/><circle cx="117" cy="55" r="28" fill="#eaf4ff"/><text x="117" y="65" font-size="28" font-weight="900" fill="#3878be">2</text><text x="117" y="116" font-size="25" font-weight="850" fill="#17213b">语境隔离</text><text x="117" y="155" font-size="17" fill="#697897">引用 · 代码 · 日志</text><text x="117" y="188" font-size="17" fill="#697897">路径 · 文件名 · 词表</text><text x="117" y="220" font-size="17" fill="#697897">目标与对象账本</text></g>
    <path d="M582 237h40" stroke="#7181a9" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(635 112)"><rect width="235" height="250" rx="28" fill="#fff" stroke="#697cff" stroke-width="3"/><circle cx="117" cy="55" r="28" fill="#eef0ff"/><text x="117" y="65" font-size="28" font-weight="900" fill="#4c60d7">3</text><text x="117" y="110" font-size="25" font-weight="850" fill="#17213b">单主路由</text><text x="117" y="148" font-size="16" fill="#697897">EXEC · REVERSE</text><text x="117" y="177" font-size="16" fill="#697897">PENTEST · GAME</text><text x="117" y="206" font-size="16" fill="#697897">CODE · FICTION · ANALYSIS</text><text x="117" y="233" font-size="16" font-weight="750" fill="#5569d7">能力图谱匹配</text></g>
    <path d="M882 237h40" stroke="#7181a9" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(935 112)"><rect width="235" height="250" rx="28" fill="url(#soft)" stroke="url(#g)" stroke-width="4"/><circle cx="117" cy="55" r="28" fill="#fff"/><text x="117" y="65" font-size="28" font-weight="900" fill="#765ae0">4</text><text x="117" y="108" font-size="25" font-weight="850" fill="#17213b">MAX 双引擎</text><rect x="24" y="132" width="187" height="40" rx="20" fill="#dff8fb"/><text x="117" y="158" font-size="16" font-weight="800" fill="#087d9d">ARMOR BREAK MAX</text><rect x="24" y="183" width="187" height="40" rx="20" fill="#f0e5ff"/><text x="117" y="209" font-size="16" font-weight="800" fill="#7e38c8">MATURE M5</text><text x="117" y="243" font-size="15" fill="#697897">按语境组合，不增路由</text></g>
