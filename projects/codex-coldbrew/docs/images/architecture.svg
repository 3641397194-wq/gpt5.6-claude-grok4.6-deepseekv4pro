  </g>
  <rect x="240" y="408" width="960" height="42" rx="21" fill="#fff" stroke="#d7def0"/><text x="720" y="435" text-anchor="middle" font-family="Inter,'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="750" fill="#596986">normalize → isolate → route → capability → compose → overlay → verify → deliver</text>
