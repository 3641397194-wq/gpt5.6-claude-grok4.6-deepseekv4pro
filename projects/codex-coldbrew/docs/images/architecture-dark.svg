  </g>
  <rect x="240" y="408" width="960" height="42" rx="21" fill="#15233b" stroke="#2b3b5c"/><text x="720" y="435" text-anchor="middle" font-family="Inter,'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="750" fill="#b2bed8">normalize → isolate → route → capability → compose → overlay → verify → deliver</text>
