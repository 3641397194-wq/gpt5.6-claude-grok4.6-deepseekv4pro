    <path d="M282 237h40" stroke="#8296c8" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(335 112)"><rect width="235" height="250" rx="28" fill="#15233b" stroke="#5eb9ff" stroke-width="3"/><circle cx="117" cy="55" r="28" fill="#19324d"/><text x="117" y="65" font-size="28" font-weight="900" fill="#8acbff">2</text><text x="117" y="116" font-size="25" font-weight="850" fill="#f2f5ff">语境隔离</text><text x="117" y="155" font-size="17" fill="#aab6d1">引用 · 代码 · 日志</text><text x="117" y="188" font-size="17" fill="#aab6d1">路径 · 文件名 · 词表</text><text x="117" y="220" font-size="17" fill="#aab6d1">目标与对象账本</text></g>
    <path d="M582 237h40" stroke="#8296c8" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(635 112)"><rect width="235" height="250" rx="28" fill="#15233b" stroke="#7394ff" stroke-width="3"/><circle cx="117" cy="55" r="28" fill="#202d55"/><text x="117" y="65" font-size="28" font-weight="900" fill="#a9baff">3</text><text x="117" y="110" font-size="25" font-weight="850" fill="#f2f5ff">单主路由</text><text x="117" y="148" font-size="16" fill="#aab6d1">EXEC · REVERSE</text><text x="117" y="177" font-size="16" fill="#aab6d1">PENTEST · GAME</text><text x="117" y="206" font-size="16" fill="#aab6d1">CODE · FICTION · ANALYSIS</text><text x="117" y="233" font-size="16" font-weight="750" fill="#a9baff">能力图谱匹配</text></g>
    <path d="M882 237h40" stroke="#8296c8" stroke-width="5" marker-end="url(#a)"/>
