    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143746"/><stop offset="1" stop-color="#302047"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8296c8"/></marker>
  </defs>
  <rect width="1440" height="480" rx="32" fill="#0f192c"/>
  <text x="720" y="52" text-anchor="middle" font-family="Inter,'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#b9c7e6">v5.0.1 · SINGLE ROUTE · FULL CHAIN · MAX DUAL ENGINE</text>
