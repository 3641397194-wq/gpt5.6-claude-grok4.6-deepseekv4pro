name: Codex ColdBrew verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Compile Python sources
        run: python -m compileall -q scripts studio skills/eni-coldbrew/scripts
      - name: Studio and review-chain tests
        run: python -m unittest discover -s studio -p 'test_*.py' -v
      - name: Governance audit
        run: python scripts/license_audit.py
      - name: Site and community audit
        run: python scripts/site_audit.py
      - name: Windows install and rollback verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verify.ps1
      - name: Unix install and rollback verification
        if: runner.os != 'Windows'
        shell: bash
        run: ./verify.sh
      - name: Build deterministic source archive
        run: python scripts/release.py build
      - name: Verify deterministic source archive
        run: python scripts/release.py verify
      - name: Confirm source artifacts match the checkout
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          # The deterministic build refreshes these tracked release
          # artifacts; release.py verify covers their contents and hash.
          git diff --exit-code -- . \
            ':(exclude)SHA256SUMS.txt' \
            ":(exclude)Codex-ColdBrew-Studio-v${VERSION}-Source.zip" \
            ":(exclude)Codex-ColdBrew-Studio-v${VERSION}-Source.sha256"

  windows-application:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build toolchain
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows application
        run: python scripts/build_windows.py build
      - name: Verify Windows application
        run: python scripts/build_windows.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-coldbrew-windows
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
